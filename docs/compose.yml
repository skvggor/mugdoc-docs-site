services:
  mugdoc-docs-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mugdoc-docs-site
    restart: unless-stopped
    networks:
      - caddy_net
    labels:
      caddy: mugdoc.reposito.rio.br
      caddy.reverse_proxy: "{{upstreams 3013}}"
      caddy.encode: "gzip"
    expose:
      - 3013

networks:
  caddy_net:
    external: true
